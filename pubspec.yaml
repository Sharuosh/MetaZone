name: meta_zone
description: MetaZone – AR Social Experience
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # Localization
  intl: ^0.20.2

  # Dependency Injection
  get_it: ^8.0.3

  # Navigation
  go_router: ^16.0.0

  # Equality
  equatable: ^2.0.7

  # Fonts
  google_fonts: ^4.0.4

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.3.2
  firebase_messaging: ^15.1.3

  google_sign_in: ^6.2.1

  shimmer: ^2.0.0
  flutter_staggered_grid_view: ^0.6.2

  package_info_plus: ^8.0.2
  internet_connection_checker_plus: ^2.5.2

  # Location & Sensors
  geolocator: ^12.0.0
  geolocator_android: ^4.6.0
  location: ^5.0.3
  flutter_compass: ^0.8.0
  sensors_plus: ^4.0.2
  permission_handler: ^12.0.1

  # Camera
  camera: ^0.11.2+1

  # Storage
  shared_preferences: ^2.2.2

  # Files
  file_picker: ^8.0.7

  # Maps
  google_maps_flutter: ^2.7.0

  # Media
  image_picker: ^1.1.2

  # QR & Share
  qr_flutter: ^4.1.0
  share_plus: ^7.0.0

  # Utilities
  uuid: ^4.5.3

  font_awesome_flutter: ^10.12.0

  # Unity
  flutter_embed_unity: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/background.jpg
    - assets/images/app_icon.png
    - assets/images/map_preview.jpg
    - assets/images/user_avatar.png
    - assets/lang/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  min_sdk_android: 30