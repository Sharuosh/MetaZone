name: meta_zone

description: MetaZone – Digital Layer for the Real World

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.9.2 <4.0.0"
  flutter: ">=3.35.7"

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  # ─────────────────────────────────────────────
  # Localization
  # ─────────────────────────────────────────────
  intl: ^0.20.2

  # ─────────────────────────────────────────────
  # Dependency Injection
  # ─────────────────────────────────────────────
  get_it: ^9.3.0

  # ─────────────────────────────────────────────
  # Navigation
  # ─────────────────────────────────────────────
  go_router: ^17.0.1

  # ─────────────────────────────────────────────
  # Equality / Models
  # ─────────────────────────────────────────────
  equatable: ^2.0.7

  # ─────────────────────────────────────────────
  # Fonts
  # ─────────────────────────────────────────────
  google_fonts: ^8.1.0

  # ─────────────────────────────────────────────
  # UI / Loading
  # ─────────────────────────────────────────────
  shimmer: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  font_awesome_flutter: ^10.12.0

  # ─────────────────────────────────────────────
  # Firebase
  # ─────────────────────────────────────────────
  firebase_core: ^3.15.2
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10
  firebase_messaging: ^15.2.10
  firebase_ai: ^2.3.0
  firebase_app_check: ^0.3.2+10

  google_sign_in: ^7.2.0

  # ─────────────────────────────────────────────
  # Networking
  # ─────────────────────────────────────────────
  dio: ^5.9.0

  # ─────────────────────────────────────────────
  # Connectivity
  # ─────────────────────────────────────────────
  internet_connection_checker_plus: ^2.5.2

  # ─────────────────────────────────────────────
  # Location / Geocoding
  # ─────────────────────────────────────────────
  geolocator: ^13.0.4
  geocoding: ^5.0.0

  # ─────────────────────────────────────────────
  # Sensors / Compass
  # ─────────────────────────────────────────────
  flutter_compass: ^0.8.1
  sensors_plus: ^4.0.2

  # ─────────────────────────────────────────────
  # Permissions
  # ─────────────────────────────────────────────
  permission_handler: ^12.0.1

  # ─────────────────────────────────────────────
  # Camera
  # ─────────────────────────────────────────────
  camera: ^0.12.0+1

  # ─────────────────────────────────────────────
  # Maps
  # ─────────────────────────────────────────────
  google_maps_flutter: ^2.14.2

  # ─────────────────────────────────────────────
  # Images / Media
  # ─────────────────────────────────────────────
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1

  # ─────────────────────────────────────────────
  # Storage / Files
  # ─────────────────────────────────────────────
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  file_picker: ^8.0.7

  # ─────────────────────────────────────────────
  # QR / Sharing
  # ─────────────────────────────────────────────
  qr_flutter: ^4.1.0
  share_plus: ^7.0.0

  # ─────────────────────────────────────────────
  # App Information
  # ─────────────────────────────────────────────
  package_info_plus: ^8.0.2

  # ─────────────────────────────────────────────
  # Utilities
  # ─────────────────────────────────────────────
  uuid: ^4.5.3

  # ─────────────────────────────────────────────
  # Unity
  # ─────────────────────────────────────────────
  flutter_embed_unity: ^1.4.0
  maplibre_gl: ^0.27.1
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  generate: true

  assets:
    - assets/images/
    - assets/lang/

    # ───────────────────────────────────────────
    # Governorate Visual System
    # ───────────────────────────────────────────

    - assets/images/governorates/CAI/
    - assets/images/governorates/GIZ/
    - assets/images/governorates/ALX/
    - assets/images/governorates/QLY/
    - assets/images/governorates/DKH/
    - assets/images/governorates/SHR/
    - assets/images/governorates/GHB/
    - assets/images/governorates/MNF/
    - assets/images/governorates/BHR/
    - assets/images/governorates/KFS/
    - assets/images/governorates/DMT/
    - assets/images/governorates/PSD/
    - assets/images/governorates/ISM/
    - assets/images/governorates/SUZ/
    - assets/images/governorates/NSI/
    - assets/images/governorates/SSI/
    - assets/images/governorates/RDS/
    - assets/images/governorates/NVL/
    - assets/images/governorates/MTR/
    - assets/images/governorates/FYM/
    - assets/images/governorates/BSF/
    - assets/images/governorates/MNY/
    - assets/images/governorates/ASY/
    - assets/images/governorates/SHG/
    - assets/images/governorates/QNA/
    - assets/images/governorates/LXR/
